<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clone2GHL</title>
  <link rel="icon" type="image/png" href="icons/logo.png">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-wrap">

    <!-- Header -->
    <div class="popup-header">
      <div class="brand">
        <img src="icons/logo.png" alt="Clone2GHL" class="brand-logo">
      </div>
      <div class="plan-badge" id="plan-badge">FREE</div>
    </div>

    <!-- Current Page Card -->
    <div class="page-card">
      <div class="page-card-label" data-i18n="currentPage">Current page</div>
      <div class="page-title" id="page-title">Loading…</div>
      <div class="page-url" id="page-url">—</div>
    </div>

    <!-- Niche Selector -->
    <div class="field-group">
      <label class="field-label" for="niche-select" data-i18n="nicheIndustry">Niche / Industry</label>
      <select class="field-select" id="niche-select" data-i18n-aria="nicheIndustry">
        <option value="general">Auto-detect</option>
        <option value="plumber">Plumber</option>
        <option value="electrician">Electrician</option>
        <option value="hvac">HVAC / AC Repair</option>
        <option value="roofing">Roofing</option>
        <option value="cleaning">Cleaning Service</option>
        <option value="landscaping">Landscaping</option>
        <option value="solar">Solar Energy</option>
        <option value="real_estate">Real Estate</option>
        <option value="gym">Gym / Fitness</option>
        <option value="dental">Dental</option>
        <option value="coaching">Coaching</option>
        <option value="insurance">Insurance</option>
        <option value="legal">Legal / Attorney</option>
        <option value="marketing_agency">Marketing Agency</option>
        <option value="weight_loss">Weight Loss</option>
      </select>
    </div>

    <!-- Options -->
    <div class="options-row">
      <div class="option-toggle">
        <div class="option-info">
          <div class="option-label" data-i18n="aiOptimize">AI Optimize</div>
          <div class="option-sub" data-i18n="aiOptimizeSub">Rewrite copy with GPT-4o</div>
        </div>
        <label class="toggle">
          <input type="checkbox" id="ai-toggle" aria-label="Toggle AI copy optimization" data-i18n-aria="aiOptimize">
          <span class="toggle-slider"></span>
        </label>
      </div>
    </div>

    <!-- Status -->
    <div class="status-box" id="status-box" role="status" aria-live="polite" style="display:none;"></div>

    <!-- Main CTA -->
    <button class="btn-clone" id="btn-clone" data-i18n="clonePage">
      ⚡ Clone This Page
    </button>

    <!-- Credits -->
    <div class="credits-bar" id="credits-bar" role="status" aria-live="polite"></div>

    <!-- Nav Links -->
    <nav class="nav-links" aria-label="Quick navigation">
      <button class="nav-link" id="btn-dashboard" data-i18n="openDashboard">
        📊 Dashboard
      </button>
      <button class="nav-link" id="btn-library" data-i18n="library">
        📚 Library
      </button>
      <button class="nav-link" id="btn-settings" data-i18n="settings">
        ⚙️ Settings
      </button>
    </nav>

  </div>

  <script src="compat.js"></script>
  <script src="upgradeLogic.js"></script>
  <script src="popup.js"></script>
</body>
</html>
